services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragathon-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    volumes:
      - ragathon-db:/app/data
    networks:
      - ragathon-net
    expose:
      - "4000"
    depends_on:
      - evaluation

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_SOCKET_URL=/
    container_name: ragathon-frontend
    restart: unless-stopped
    networks:
      - ragathon-net
    expose:
      - "80"
    depends_on:
      - backend

  evaluation:
    build:
      context: ./evaluation
      dockerfile: Dockerfile
    container_name: ragathon-evaluation
    restart: unless-stopped
    networks:
      - ragathon-net
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: ragathon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # uncomment once SSL certs are mounted below
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # mount SSL certs here for HTTPS
    networks:
      - ragathon-net
    depends_on:
      - frontend
      - backend

networks:
  ragathon-net:
    driver: bridge

volumes:
  ragathon-db:
    driver: local
